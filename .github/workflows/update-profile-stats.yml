name: Update Profile Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&text_color=c9d1d9&title_color=c9d1d9&icon_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=00000000&text_color=c9d1d9&title_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=00000000&color=c9d1d9&line=c9d1d9&point=c9d1d9&area=true&hide_border=true&custom_title=Activity%20Graph
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy activity graph into profile
        run: cp dist/activity-graph.svg profile/activity-graph.svg

      - name: Update README image references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(r"## 📊 GitHub Stats.*?(?=</div>\s*\n\s*---)", re.S)
          replacement = '''## 📊 GitHub Stats

<br/>

<p align="center">
  <img height="160" src="./profile/stats.svg" alt="GitHub Stats" />
  <img height="160" src="./profile/activity-graph.svg" alt="GitHub Activity Graph" />
</p>

<p align="center">
  <img height="160" src="./profile/top-langs.svg" alt="Top Languages" />
</p>

'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("GitHub Stats section not found")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit generated cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): update GitHub stats [skip ci]"
          git push
